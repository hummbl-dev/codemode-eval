[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemode-eval"
version = "0.1.0"
description = "Eval harness for sandboxed code-orchestration agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
codemode-eval = "codemode_eval.cli:main"

[tool.setuptools]
packages = ["codemode_eval"]
